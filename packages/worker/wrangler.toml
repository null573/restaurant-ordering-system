name = "restaurant-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ===== Cloudflare D1 数据库 =====
[[d1_databases]]
binding = "DB"
database_name = "restaurant-db"
database_id = "ce0f6ba7-f3c5-4f6d-a01b-4bdbef642cdd"

# ===== KV (会话/缓存) =====
[[kv_namespaces]]
binding = "KV"
id = "60ae6b0cdcba48b68ed79661aa8129b5"
preview_id = "30a73286a4b44f76af4e89c74da77784"

# ===== R2 (菜品图片存储) =====
[[r2_buckets]]
binding = "R2"
bucket_name = "restaurant-images"

# ===== Durable Objects (实时订单同步房间) =====
[[durable_objects.bindings]]
name = "DESK_ROOM"
class_name = "DeskRoomDO"

# Durable Objects 迁移 (顶层 migrations)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeskRoomDO"]

# ===== 环境变量 =====
[vars]
PUBLIC_R2_DOMAIN = "https://restaurant-images.zbeve.workers.dev"
APP_BASE_URL = "https://restaurant-web-9d9.pages.dev"
DEFAULT_TRIAL_DAYS = "7"
DEFAULT_PLAN_PRICE_FEN = "9900"
DEFAULT_PLAN_CYCLE_DAYS = "30"
JWT_SECRET = "r0s-rest-jwt-s3cret-2024-xyz789abc"

# ===== Cron 定时任务 =====
[triggers]
crons = ["0 3 * * *"]
