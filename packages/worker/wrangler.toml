name = "restaurant-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ===== Cloudflare D1 数据库 =====
# 需要先在 Cloudflare Dashboard 创建 D1 数据库，然后填入 database_id
# 创建方法: Workers & Pages → D1 → Create database → 命名为 restaurant-db
[[d1_databases]]
binding = "DB"
database_name = "restaurant-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# ===== KV (会话/缓存) =====
[[kv_namespaces]]
binding = "KV"
id = "60ae6b0cdcba48b68ed79661aa8129b5"

# ===== R2 (菜品图片存储) =====
[[r2_buckets]]
binding = "R2"
bucket_name = "restaurant-images"

# ===== Durable Objects (实时订单同步房间) =====
[[durable_objects.bindings]]
name = "DESK_ROOM"
class_name = "DeskRoomDO"

[[durable_objects.migrations]]
tag = "v1"
new_sqlite_classes = ["DeskRoomDO"]

# ===== 环境变量 (非敏感) =====
[vars]
# R2 图片访问域名 (可绑定自定义域名，或用 r2.dev 测试域名)
PUBLIC_R2_DOMAIN = "https://restaurant-images.zbeve.workers.dev"
# 前端应用地址
APP_BASE_URL = "https://restaurant-web-9d9.pages.dev"
# 默认试用天数和价格
DEFAULT_TRIAL_DAYS = "7"
DEFAULT_PLAN_PRICE_FEN = "9900"     # 99元/月
DEFAULT_PLAN_CYCLE_DAYS = "30"

# ===== Cron 定时任务 =====
[triggers]
crons = ["0 3 * * *"]  # 每天凌晨3点检查订阅到期
